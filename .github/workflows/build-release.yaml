name: build-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Decode the keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/localmaterialnotes_keystore.jks

      - name: Add the key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties

      - name: Diagnostics (temporal)
        run: |
          sha256sum android/localmaterialnotes_keystore.jks
          wc -c android/localmaterialnotes_keystore.jks
          awk -F= '{print $1"="length($2)}' android/key.properties

      - name: Get the dependencies
        run: flutter pub get

      - name: Generate the code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate the localizations
        run: flutter gen-l10n

      - name: Build the release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          gh release create "v$VERSION" --title "Local Material Notes $VERSION" --notes "Release build ${{ github.run_number }}" --latest || true
          gh release upload "v$VERSION" build/app/outputs/flutter-apk/app-*-release.apk --clobber
