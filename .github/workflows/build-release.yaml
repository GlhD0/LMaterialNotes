name: build-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Increment with every personal update; it tags and titles the release,
      # is embedded in the app (shown in Settings → About) and raises the APK
      # build number (base 38 + MAJOR*10 + MINOR, so 1.4 → 52 → APK codes 52x).
      # Format must be X.Y.
      PERSONAL_VERSION: '1.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable

      - name: Decode the keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/localmaterialnotes_keystore.jks

      - name: Add the key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties

      - name: Get the dependencies
        run: flutter pub get

      - name: Generate the code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate the localizations
        run: flutter gen-l10n

      - name: Build the release APKs
        run: |
          BASE=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BASE_CODE=${BASE#*+}
          MAJOR=${PERSONAL_VERSION%%.*}
          MINOR=${PERSONAL_VERSION##*.}
          BUILD_NUMBER=$((BASE_CODE + MAJOR * 10 + MINOR))
          flutter build apk --release --split-per-abi \
            --build-number=$BUILD_NUMBER \
            --dart-define=PERSONAL_VERSION=${PERSONAL_VERSION}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          VERSION="${BASE}-personal_v${PERSONAL_VERSION}"
          CHANGELOG=$(awk -v v="$BASE" 'index($0, "## " v) == 1 {flag=1} (flag && $0 ~ /^## / && index($0, "## " v) != 1) {flag=0} flag' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then CHANGELOG="Release build ${{ github.run_number }}"; fi
          NOTES="${CHANGELOG}

          ---
          Changelog completo: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          gh release create "v$VERSION" --title "Local Material Notes $VERSION" --notes "$NOTES" --latest || true
          gh release upload "v$VERSION" build/app/outputs/flutter-apk/app-*-release.apk --clobber
          gh release edit "v$VERSION" --notes "$NOTES"
